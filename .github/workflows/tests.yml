name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - name: Install the DSH host used by the mode registration test
        run: npm install --prefix "$RUNNER_TEMP/dsh-runtime" --ignore-scripts @deepseek-ai/dsh@${{ matrix.dsh }}
      - name: Check registration and helper execution in a clean DSH profile
        run: DSH_RUNTIME_PACKAGE="$RUNNER_TEMP/dsh-runtime/node_modules/@deepseek-ai/dsh/package.json" node --test tests/runtime.test.js
